<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Moodboard Interior Design - Tonalia</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="quiz.css">
</head>
<body>

  <!-- HEADER / NAVEGACIÓN -->
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <a href="home.html" class="brand-logo">Tonalia</a>
        <span class="brand-tagline">Interior design a modo tuo</span>
      </div>
      <nav class="main-nav">
        <a href="configuratore.html" class="active">Il Configuratore</a>
        <a href="esplora-stili.html">Esplora gli Stili</a>
        <a href="servizi-3d.html">Servizi 3D</a>
        <a href="design-journal.html">Design Journal</a>
        <a href="chi-siamo.html">Chi Siamo</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- CONTENEDOR DEL QUIZ -->
    <div id="quiz-container" class="fade-in">
      <div class="question-header">
        <span id="step-subtitle">01 / SCEGLI LO STILE</span>
        <h2 id="question">Qual è il tuo stile preferito?</h2>
        <p id="question-subtitle">Lasciati guidare dalle forme. Scegli l'interno che senti più tuo.</p>
      </div>
      <div id="options"></div>
    </div>

    <!-- TARJETA DE RESULTADO -->
    <div id="result-card" class="fade-in" style="display: none;">
      <span id="code-output"></span>
      <h3 id="moodboard-type"></h3>
      <p id="desc-output"></p>
      <img id="moodboard-img" src="" alt="Anteprima Moodboard">
      <div id="palette-grid"></div>
      <small id="copy-hint">Clicca su un colore per copiare il codice HEX</small>
      <button type="button" onclick="restartQuiz()">Ricomincia il quiz</button>
    </div>
  </main>

  <script src="moodboards-data.js"></script>
</body>
</html>
