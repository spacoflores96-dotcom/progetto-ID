<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Moodboard Interior Design</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="quiz-container" class="fade-in">
    <div class="progress-wrapper">
      <div class="progress-info">
        <span id="step-text">Domanda 1 di 3</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progress-fill"></div>
      </div>
    </div>

    <div id="question-box">
      <h2 id="question"></h2>
      <div id="options"></div>
    </div>
  </div>

  <div id="result-card" class="fade-in" style="display: none;">
    <span id="code-output"></span>
    <h3 id="moodboard-type"></h3>
    <p id="desc-output"></p>
    <div id="palette-grid"></div>
    <small id="copy-hint">Clicca su un colore per copiare il codice HEX</small>
    <button onclick="restartQuiz()">Ricomincia il quiz</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
